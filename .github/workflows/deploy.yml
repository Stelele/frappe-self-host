name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps.json"
      - ".github/workflows/deploy.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build custom Frappe image
        uses: docker/build-push-action@v5
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.sha }}
          secrets: |
            apps_json=${{ github.workspace }}/apps.json
          tags: basapos:16
          outputs: type=docker,dest=/tmp/basapos-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: basapos-image
          path: /tmp/basapos-image.tar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: basapos-image
          path: /tmp

      - name: Load image on server
        run: |
          docker load -i /tmp/basapos-image.tar
          docker tag basapos:16 basapos:16

      - name: Deploy stack
        run: |
          bash scripts/deploy.sh
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          DOMAINS: ${{ secrets.DOMAINS }}
