name: ci

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read
  packages: read

concurrency:
  # keyed by event so a manual dispatch can't cancel an in-flight push pipeline
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Two lanes, one cache.
#   LANE A (distro): content-hash → GHCR. Cache miss = rebuild + Linux
#   firstboot smoke (kill+resume) + push sha256-<hash> (+ repoint :main-green).
#   LANE B (windows-drill): after [lint,gui], against the pinned CACHED distro
#   (:main-green) in parallel with lane A — the old 15-18m drill fleet is gone.
#   release: tags only, gates on [gui, distro, windows-drill], direct publish.
#
# Target: every event green < 10 min in steady state (cache active). The very
# first master run seeds the cache and runs serial (one-time bootstrap).

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck + bash -n
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          fail=0
          for f in $(git ls-files '*.sh'); do
            echo "checking $f"
            shellcheck -S error "$f" || fail=1
            bash -n "$f" || fail=1
          done
          exit $fail

  gui:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test logic components
        run: dotnet test setup-gui.tests/BasaPOS-Setup.tests.csproj -c Release
      - name: Test keeper components
        run: dotnet test keeper.tests/BasaPOS.Keeper.Tests.csproj -c Release
      - name: Publish keeper (WinExe, cross-build from Linux)
        run: |
          dotnet publish keeper/BasaPOS.Keeper.csproj -c Release \
            -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
            -o publish-keeper
      - name: Build GUI (WinForms compile check)
        run: dotnet build setup-gui/BasaPOS-Setup.csproj -c Release --nologo
      - name: Publish single-file win-x64 (cross-build from Linux)
        run: |
          dotnet publish setup-gui/BasaPOS-Setup.csproj -c Release \
            -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
            -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: basapos-setup-gui
          retention-days: 14
          path: publish/BasaPOS-Setup.exe
      - name: Publish downloader (cross-build from Linux)
        run: |
          dotnet publish downloader/BasaPOS-Downloader.csproj -c Release \
            -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
            -o publish-dl
      - uses: actions/upload-artifact@v4
        with:
          name: basapos-downloader
          retention-days: 14
          path: publish-dl/BasaPOS-Downloader.exe
      - uses: actions/upload-artifact@v4
        with:
          name: basapos-keeper
          retention-days: 14
          path: publish-keeper/BasaPOS.Keeper.exe

  distro:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      cache-hit: ${{ steps.cache-check.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install oras
        run: |
          curl -fsSL -o /tmp/oras.tgz https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz
          tar -xzf /tmp/oras.tgz -C /usr/local/bin oras
          oras version
      - name: Compute distro content hash
        id: hash
        run: echo "DISTRO_SHA=$(bash scripts/distro-hash.sh)" >> "$GITHUB_OUTPUT"
      - name: GHCR cache probe
        id: cache-check
        env:
          DISTRO_TAG: sha256-${{ steps.hash.outputs.DISTRO_SHA }}
        run: |
          if oras manifest fetch "ghcr.io/stelele/frappe-self-host/basapos-distro:$DISTRO_TAG" >/dev/null 2>&1; then
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk + report
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Install pigz
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y pigz
      - name: Build + validate + split
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: bash appliance/build.sh
      - name: Firstboot convergence smoke (Linux, mid-stack kill + resume)
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: bash appliance/smoke-firstboot.sh basapos-distro:16
      - name: Reconstruct tarball from cache
        if: steps.cache-check.outputs.cache-hit == 'true'
        run: |
          mkdir -p appliance/dist
          oras pull "ghcr.io/stelele/frappe-self-host/basapos-distro:sha256-${{ steps.hash.outputs.DISTRO_SHA }}"
          f=$(find . -maxdepth 1 -type f \( -name 'basapos-distro.tar.gz.tmp' -o -name '*.gz' \) | head -1)
          if [ -z "$f" ]; then
            echo "cache pull produced no tarball"; ls -la; exit 1
          fi
          mv "$f" appliance/dist/basapos-distro.tar.gz.tmp
          bash appliance/validate.sh appliance/dist/basapos-distro.tar.gz.tmp
          (cd appliance/dist \
            && split -b 1900m -d basapos-distro.tar.gz.tmp basapos-distro.tar.part- \
            && sha256sum basapos-distro.tar.gz.tmp basapos-distro.tar.part-* > SHA256SUMS)
      - name: Publish content tag (skip on PR — the master run seeds the cache)
        if: steps.cache-check.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        env:
          GHCR: ghcr.io/stelele/frappe-self-host/basapos-distro
          DISTRO_TAG: sha256-${{ steps.hash.outputs.DISTRO_SHA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oras login ghcr.io --username "$GITHUB_ACTOR" --password "$GH_TOKEN"
          oras push "$GHCR:$DISTRO_TAG" \
            --artifact-type application/vnd.frappe.distro.tarball-gz \
            appliance/dist/basapos-distro.tar.gz.tmp:application/gzip
          oras tag "$GHCR:$DISTRO_TAG" main-green
      - uses: actions/upload-artifact@v4
        with:
          name: basapos-distro
          retention-days: 14
          path: appliance/dist/

  windows-drill:
    needs: [lint, gui]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install oras
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_windows_amd64.zip -OutFile oras.zip
          Expand-Archive oras.zip -DestinationPath oras-dir
          Add-Content -Path $env:GITHUB_PATH -Value "$pwd\oras-dir" -Encoding ascii
      - uses: actions/download-artifact@v4
        with: { name: basapos-setup-gui, path: gui }
      - uses: actions/download-artifact@v4
        with: { name: basapos-downloader, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: basapos-keeper, path: keeper }
      - name: Pull cached distro (main-green) or bootstrap from this run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oras login ghcr.io --username "$env:GITHUB_ACTOR" --password "$env:GH_TOKEN"
          oras pull ghcr.io/stelele/frappe-self-host/basapos-distro:main-green
          if ($LASTEXITCODE -eq 0) {
            $p = Get-ChildItem -File | Where-Object { $_.Name -match 'basapos-distro|application_gzip' } | Select-Object -First 1
            if (-not $p) { Write-Error "unexpected oras pull artifact name"; Get-ChildItem -File; exit 1 }
            Move-Item -Force $p.FullName distro.tar.gz
            Write-Host "distro.tar.gz from GHCR :main-green"
          } else {
            Write-Host "bootstrap: :main-green not cached yet - using this run's distro artifact"
            $gh = "https://api.github.com/repos/stelele/frappe-self-host"
            $id = $null
            for ($i = 0; $i -lt 120 -and -not $id; $i++) {
              $id = & gh api "$gh/actions/runs/$env:GITHUB_RUN_ID/artifacts" `
                --jq -r '.artifacts[] | select(.name=="basapos-distro") | .id' 2>$null |
                Select-Object -First 1
              if (-not $id) { Start-Sleep -Seconds 10 }
            }
            if (-not $id) { Write-Error "bootstrap: this run produced no distro artifact"; exit 1 }
            New-Item -ItemType Directory -Path tmp-distro | Out-Null
            & gh api "$gh/actions/artifacts/$id/zip" -o tmp-distro/distro.zip
            Expand-Archive tmp-distro/distro.zip -DestinationPath tmp-distro/unz
            $expect = @{}
            Get-Content tmp-distro/unz/SHA256SUMS | ForEach-Object {
              if ($_ -match '^([0-9a-f]{64})\s{2}(.+)$') { $expect[$matches[2]] = $matches[1] }
            }
            $parts = Get-ChildItem tmp-distro/unz/basapos-distro.tar.part-* | Sort-Object Name
            foreach ($p in $parts) {
              $h = (Get-FileHash -Algorithm SHA256 $p.FullName).Hash.ToLowerInvariant()
              if ($expect[$p.Name] -ne $h) { Write-Error "SHA256SUMS mismatch: $($p.Name)"; exit 1 }
            }
            $dst = [IO.File]::Create("distro.tar.gz")
            try {
              foreach ($p in $parts) {
                $bytes = [IO.File]::ReadAllBytes($p.FullName)
                $dst.Write($bytes, 0, $bytes.Length)
              }
            } finally { $dst.Close() }
            if ($expect['basapos-distro.tar.gz.tmp'] -and
                (Get-FileHash -Algorithm SHA256 distro.tar.gz).Hash.ToLowerInvariant() -ne $expect['basapos-distro.tar.gz.tmp']) {
              Write-Error "reassembled tarball hash mismatch"; exit 1
            }
            Write-Host "bootstrap fallback OK: distro.tar.gz from this run's artifact"
          }
      - name: Assemble payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/payload | Out-Null
          Copy-Item gui/BasaPOS-Setup.exe out/
          Copy-Item dl/BasaPOS-Downloader.exe out/
          Copy-Item keeper/BasaPOS.Keeper.exe out/payload/
          Copy-Item payload/basapos.ico out/payload/
          $chunk = 1900L * 1024L * 1024L
          $src = [IO.File]::OpenRead("distro.tar.gz")
          $buf = New-Object byte[] (4194304)
          $idx = 0
          $part = [IO.File]::Create("out/payload/basapos-distro.tar.part-{0:D2}" -f $idx)
          try {
            while ($true) {
              if ($part.Position -ge $chunk) {
                $part.Close()
                $idx++
                $part = [IO.File]::Create("out/payload/basapos-distro.tar.part-{0:D2}" -f $idx)
              }
              $read = $src.Read($buf, 0, $buf.Length)
              if ($read -le 0) { break }
              $part.Write($buf, 0, $read)
            }
          } finally {
            $part.Close(); $src.Close()
          }
          # same layout the old payload job shipped: tarball entry + parts + keeper/ico
          $lines = @()
          $lines += "$((Get-FileHash -Algorithm SHA256 distro.tar.gz).Hash.ToLowerInvariant())  basapos-distro.tar.gz.tmp"
          foreach ($p in Get-ChildItem out/payload/basapos-distro.tar.part-* | Sort-Object Name) {
            $lines += "$((Get-FileHash -Algorithm SHA256 $p.FullName).Hash.ToLowerInvariant())  $($p.Name)"
          }
          # installer verifies keeper files against these entries (Prereqs.AssertPayloadHashes)
          $lines += "$((Get-FileHash -Algorithm SHA256 out/payload/BasaPOS.Keeper.exe).Hash.ToLowerInvariant())  BasaPOS.Keeper.exe"
          $lines += "$((Get-FileHash -Algorithm SHA256 out/payload/basapos.ico).Hash.ToLowerInvariant())  basapos.ico"
          $lines | Out-File out/payload/SHA256SUMS -Encoding ascii
          curl.exe -fsSL -o out/payload/wsl.msi `
            https://github.com/microsoft/WSL/releases/download/2.7.11/wsl.2.7.11.0.x64.msi
      - name: Drill - install
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup-gui/e2e/drill-install.ps1 -SetupExe (Resolve-Path out/BasaPOS-Setup.exe) -PayloadDir (Resolve-Path out/payload)
      - name: Drill - uninstall
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup-gui/e2e/drill-uninstall.ps1 -SetupExe (Resolve-Path out/BasaPOS-Setup.exe)
      - name: Drill logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            C:/BasaPOS/logs/**
            C:/BasaPOS/config/credentials.txt
            C:/ProgramData/BasaPOS/install.log
          if-no-files-found: ignore

  release:
    needs: [gui, distro, windows-drill]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: basapos-setup-gui, path: gui }
      - uses: actions/download-artifact@v4
        with: { name: basapos-downloader, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: basapos-keeper, path: keeper }
      - uses: actions/download-artifact@v4
        with: { name: basapos-distro, path: parts }
      - name: Assemble release payload
        run: |
          mkdir -p out/payload
          cp gui/BasaPOS-Setup.exe out/BasaPOS-Setup.exe
          cp dl/BasaPOS-Downloader.exe out/BasaPOS-Downloader.exe
          cp keeper/BasaPOS.Keeper.exe out/payload/
          cp payload/basapos.ico out/payload/
          cp parts/basapos-distro.tar.part-* parts/SHA256SUMS out/payload/
          # installer verifies keeper files against these entries (Prereqs.AssertPayloadHashes)
          (cd out/payload && sha256sum BasaPOS.Keeper.exe basapos.ico >> SHA256SUMS)
          curl -fsSL -o out/payload/wsl.msi \
            https://github.com/microsoft/WSL/releases/download/2.7.11/wsl.2.7.11.0.x64.msi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum BasaPOS-Setup.exe >> payload/SHA256SUMS)
          NOTES="BasaPOS offline installer (Windows).

          Quick start — download the small downloader once, then it fetches this
          release and assembles everything for you:
            https://github.com/Stelele/frappe-self-host/releases/latest/download/BasaPOS-Downloader.exe

          Or fetch everything yourself:
            gh release download ${{ github.ref_name }}
            scripts/fetch-release.sh ${{ github.ref_name }}

          Assets: BasaPOS-Setup.exe (installer), BasaPOS-Downloader.exe (bootstrap),
          payload/ (parts + SHA256SUMS + wsl.msi)."
          gh release create "${{ github.ref_name }}" \
            out/BasaPOS-Setup.exe out/BasaPOS-Downloader.exe out/payload/* \
            --title "${{ github.ref_name }}" \
            --notes "$NOTES"