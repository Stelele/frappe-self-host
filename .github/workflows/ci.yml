name: ci

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # keyed by event so a manual dispatch can't cancel an in-flight push pipeline
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck + bash -n
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          fail=0
          for f in $(git ls-files '*.sh'); do
            echo "checking $f"
            shellcheck -S error "$f" || fail=1
            bash -n "$f" || fail=1
          done
          exit $fail

  gui:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test logic components
        run: dotnet test setup-gui.tests/BasaPOS-Setup.tests.csproj -c Release
      - name: Build GUI (WinForms compile check)
        run: dotnet build setup-gui/BasaPOS-Setup.csproj -c Release --nologo
      - name: Publish single-file win-x64 (cross-build from Linux)
        run: |
          dotnet publish setup-gui/BasaPOS-Setup.csproj -c Release \
            -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
            -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: basapos-setup-gui
          retention-days: 14
          path: publish/BasaPOS-Setup.exe

  distro:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk + report
        run: |
          docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Build, validate, split
        run: bash appliance/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: basapos-distro
          retention-days: 14
          path: appliance/dist/

  firstboot-drill:
    needs: distro
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - name: Free disk + report
        run: |
          docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: basapos-distro
          path: artifact
      - name: Reconstruct distro image from parts
        run: |
          cd artifact
          grep 'basapos-distro.tar.part-' SHA256SUMS | sha256sum -c -
          cd ..
          cat artifact/basapos-distro.tar.part-* > basapos-distro.tar.gz
          docker import basapos-distro.tar.gz basapos-distro:drill
          rm -f basapos-distro.tar.gz
      - name: Kill-at-every-phase drill
        run: bash appliance/test-firstboot.sh basapos-distro:drill

  payload:
    needs: [distro, gui]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: basapos-distro, path: parts }
      - uses: actions/download-artifact@v4
        with: { name: basapos-setup-gui, path: gui }
      - name: Assemble payload folder
        run: |
          mkdir -p out/payload
          cp gui/BasaPOS-Setup.exe out/BasaPOS-Setup.exe
          cp parts/basapos-distro.tar.part-* parts/SHA256SUMS out/payload/
          curl -fsSL -o out/payload/wsl.msi \
            https://github.com/microsoft/WSL/releases/download/2.7.11/wsl.2.7.11.0.x64.msi
      - uses: actions/upload-artifact@v4
        with: { name: basapos-payload, retention-days: 14, path: out }

  e2e-windows:
    needs: payload
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: basapos-payload, path: out }
      - name: Drill 1/3 - install
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup-gui/e2e/drill-install.ps1 -SetupExe (Resolve-Path out/BasaPOS-Setup.exe) -PayloadDir (Resolve-Path out/payload)
      - name: Drill 2/3 - reinstall
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup-gui/e2e/drill-reinstall.ps1 -SetupExe (Resolve-Path out/BasaPOS-Setup.exe) -PayloadDir (Resolve-Path out/payload)
      - name: Drill 3/3 - uninstall
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup-gui/e2e/drill-uninstall.ps1 -SetupExe (Resolve-Path out/BasaPOS-Setup.exe)
      - name: Drill logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/basapos-setup.log
            C:/BasaPOS/logs/**
          if-no-files-found: ignore
