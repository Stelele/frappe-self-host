name: ci

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck + bash -n
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          fail=0
          for f in $(git ls-files '*.sh'); do
            echo "checking $f"
            shellcheck -S error "$f" || fail=1
            bash -n "$f" || fail=1
          done
          exit $fail
