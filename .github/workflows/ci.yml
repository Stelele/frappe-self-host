name: ci

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # keyed by event so a manual dispatch can't cancel an in-flight push pipeline
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck + bash -n
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          fail=0
          for f in $(git ls-files '*.sh'); do
            echo "checking $f"
            shellcheck -S error "$f" || fail=1
            bash -n "$f" || fail=1
          done
          exit $fail

  gui:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build (logic-only tests need Windows runtime — build verifies compilation)
        run: dotnet build setup-gui.tests/BasaPOS-Setup.tests.csproj -c Release

  distro:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk + report
        run: |
          docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Build, validate, split
        run: bash appliance/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: basapos-distro
          retention-days: 14
          path: appliance/dist/

  firstboot-drill:
    needs: distro
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - name: Free disk + report
        run: |
          docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: basapos-distro
          path: artifact
      - name: Reconstruct distro image from parts
        run: |
          cd artifact
          grep 'basapos-distro.tar.part-' SHA256SUMS | sha256sum -c -
          cd ..
          cat artifact/basapos-distro.tar.part-* > basapos-distro.tar.gz
          docker import basapos-distro.tar.gz basapos-distro:drill
          rm -f basapos-distro.tar.gz
      - name: Kill-at-every-phase drill
        run: bash appliance/test-firstboot.sh basapos-distro:drill
