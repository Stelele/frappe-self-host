name: ci

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Prior run ID whose Setup.exe to re-drill (drill-debug). Leave empty for a full run.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Keyed by event_name so a workflow_dispatch (drill-debug or manual run) can
  # never cancel an in-flight push/tag pipeline on the same ref.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- base tier
  lint:
    if: ${{ !github.event.inputs.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse all payload scripts
        run: |
          set -e
          fail=0
          for f in $(find package -name '*.ps1' -type f); do
            echo "parsing $f"
            if ! pwsh -NoProfile -Command "\$null = [scriptblock]::Create((Get-Content -Raw '$f')); Write-Host '  OK'"; then
              fail=1
            fi
          done
          exit $fail

  rootfs:
    if: ${{ !github.event.inputs.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check cache
        id: cache
        uses: actions/cache@v4
        with:
          path: appliance/dist/basapos-rootfs.tar.gz
          key: rootfs-${{ hashFiles('appliance/**', 'apps.json') }}

      - name: Build, smoke, stamp, export, validate
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash appliance/build.sh

      - name: Checksum + size report
        run: |
          cd appliance/dist
          sha256sum basapos-rootfs.tar.gz > SHA256SUMS
          cat SHA256SUMS && ls -lh basapos-rootfs.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: basapos-rootfs
          retention-days: 14
          path: appliance/dist/

  e2e-boot:
    needs: rootfs
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: basapos-rootfs
          path: appliance/dist

      - name: WSL2 import + boot + health E2E
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File package/e2e/e2e-import-boot.ps1 -RootfsTar appliance/dist/basapos-rootfs.tar.gz

  # ---------------------------------------------------------------- full tier
  linux-image:
    needs: lint
    if: ${{ !github.event.inputs.run_id && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build custom Frappe image
        uses: docker/build-push-action@v5
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            # Bust cache on content changes, not per-commit: apps.json drives the
            # image payload; frappe_docker/** covers the submodule build files.
            # (Keyed to github.sha this build was uncacheable on every push.)
            CACHE_BUST=${{ hashFiles('apps.json', 'frappe_docker/**') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: |
            apps_json=${{ github.workspace }}/apps.json
          tags: basapos:16
          outputs: type=docker,dest=/tmp/basapos-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: basapos-image
          retention-days: 14
          path: /tmp/basapos-image.tar

  installer:
    needs: rootfs
    if: ${{ !github.event.inputs.run_id && github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: basapos-rootfs
          path: appliance/dist

      - name: Stage WSL MSI (pinned)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/wsl | Out-Null
          $url = 'https://github.com/microsoft/WSL/releases/download/2.7.11/wsl.2.7.11.0.x64.msi'
          Invoke-WebRequest -Uri $url -OutFile package/wsl/wsl.msi

      - name: Assemble + compile installer
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v',''
          if ($tag -match '^\d') { $v = $tag } else { $v = '0.1.0' }
          powershell -NoProfile -ExecutionPolicy Bypass -File package/build.ps1 -Version $v `
            -RootfsTar appliance/dist/basapos-rootfs.tar.gz

      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem package/build/output/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File (Join-Path $_.DirectoryName 'SHA256SUMS') -Encoding ascii
            Get-Content (Join-Path $_.DirectoryName 'SHA256SUMS')
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BasaPOS-Setup
          # Longer than the rest: drill-debug re-drills prior runs' Setup.exe,
          # which breaks silently once the artifact expires.
          retention-days: 30
          path: package/build/output/

  install-drill:
    needs: installer
    runs-on: windows-latest
    # Safety net, not a requirement: phases are separate steps that fail fast
    # with per-step attribution (install / upgrade / uninstall); the healthy
    # path is ~25-35 min, so hitting 60 means something is genuinely stuck.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: BasaPOS-Setup
          path: setup-output

      - name: Drill 1/3 - install + boot-wrapper
        shell: pwsh
        run: |
          $exe = Get-ChildItem setup-output -Filter 'BasaPOS-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Setup exe not found in artifact' }
          Write-Host "Drilling $($exe.Name)"
          pwsh -NoProfile -ExecutionPolicy Bypass -File package/e2e/drill-install.ps1 -SetupExe $exe.FullName

      - name: Drill 2/3 - upgrade
        shell: pwsh
        run: |
          $exe = Get-ChildItem setup-output -Filter 'BasaPOS-Setup-*.exe' | Select-Object -First 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File package/e2e/drill-upgrade.ps1 -SetupExe $exe.FullName

      - name: Drill 3/3 - uninstall
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File package/e2e/drill-uninstall.ps1

      - name: Upload drill logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-drill-logs
          # Appliance logs are copied here by the drill (upload-artifact cannot
          # see %LOCALAPPDATA% — env vars are not expanded in these paths).
          path: |
            ${{ runner.temp }}/inno-install.log
            ${{ runner.temp }}/inno-upgrade.log
            ${{ runner.temp }}/inno-uninstall.log
            ${{ runner.temp }}/basapos-logs/**
          if-no-files-found: ignore

  release:
    needs: [install-drill, e2e-boot, linux-image]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: BasaPOS-Setup
          path: package/build/output

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" package/build/output/* --title "${{ github.ref_name }}" --notes "BasaPOS offline installer. Verify SHA256SUMS before running."

  # ------------------------------------------------------- dispatch-only tool
  drill-debug:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_id }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download setup exe from prior run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          echo "Downloading artifacts from run $RUN_ID"
          mkdir -p setup-output
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" -q '.artifacts[] | select(.name=="BasaPOS-Setup") | .id' | while read ART_ID; do
            gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > artifact.zip
            unzip -o artifact.zip -d setup-output/
          done
          if [ -z "$(ls -A setup-output 2>/dev/null)" ]; then
            echo "ERROR: no Basapos-Setup artifacts for run $RUN_ID."
            echo "Artifacts expire after 30 days (BasaPOS-Setup retention) — use a newer run, or download the exe from the GitHub release instead."
            exit 1
          fi
          ls -la setup-output/

      - name: Installer drill (install + boot-wrapper only)
        shell: pwsh
        run: |
          $exe = Get-ChildItem setup-output -Filter 'BasaPOS-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { throw "Setup exe not found (artifact expired (>30 days) or not a full-tier run?). Contents: $(Get-ChildItem setup-output | Out-String)" }
          Write-Host "Drilling $($exe.Name)"
          pwsh -NoProfile -ExecutionPolicy Bypass -File package/e2e/drill-install.ps1 -SetupExe $exe.FullName

      - name: Upload drill logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drill-debug-logs
          # Appliance logs are copied here by the drill (upload-artifact cannot
          # see %LOCALAPPDATA% — env vars are not expanded in these paths).
          path: |
            ${{ runner.temp }}/inno-install.log
            ${{ runner.temp }}/basapos-logs/**
          if-no-files-found: ignore
