name: drill-debug

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions run ID to reuse artifacts from (leave empty for latest)'
        required: false

permissions:
  contents: read
  actions: read

jobs:
  install-drill:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download setup exe from prior run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow=windows-release --status=completed --limit=10 --json databaseId,conclusion -q '.[] | select(.conclusion=="success") | .databaseId' | head -1)
          fi
          echo "Downloading artifacts from run $RUN_ID"
          mkdir -p setup-output
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" -q '.artifacts[] | select(.name=="BasaPOS-Setup") | .id' | while read ART_ID; do
            gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > artifact.zip
            unzip -o artifact.zip -d setup-output/
          done
          ls -la setup-output/

      - name: Installer drill (install + boot-wrapper only)
        shell: pwsh
        run: |
          $exe = Get-ChildItem setup-output -Filter 'BasaPOS-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { throw "Setup exe not found. Contents: $(Get-ChildItem setup-output | Out-String)" }
          Write-Host "Drilling $($exe.Name)"
          powershell -NoProfile -ExecutionPolicy Bypass -File package/e2e/install-drill-minimal.ps1 -SetupExe $exe.FullName

      - name: Upload drill logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drill-debug-logs
          path: |
            ${{ runner.temp }}/inno-install.log
            ${{ runner.temp }}/inno-upgrade.log
            %LOCALAPPDATA%/Programs/BasaPOS/logs/**
          if-no-files-found: ignore
